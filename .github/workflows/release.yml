name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Put rc.exe on PATH when the Windows SDK has it
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $rc = & $vswhere -latest -products * -find "**\rc.exe" | Select-Object -First 1
            if ($rc) { Add-Content $env:GITHUB_PATH (Split-Path $rc) }
          }
      - name: Test and build
        run: |
          cargo test --workspace
          cargo build --release -p oxypixel
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y
          # Chocolatey adds NSIS to the machine PATH in the registry. Actions
          # starts the next step from the original PATH plus GITHUB_PATH, so
          # `makensis` stays unresolved unless this directory is published.
          $candidates = @(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "$env:ProgramFiles\NSIS\makensis.exe"
          )
          $makensis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) {
            throw "makensis.exe was not found after 'choco install nsis'"
          }
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path -Parent $makensis)
          "MAKENSIS=$makensis" | Add-Content -Path $env:GITHUB_ENV
          Write-Host "Using $makensis"
      - name: Stage files
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/oxypixel.exe dist/oxypixel.exe
          Copy-Item target/release/oxypixel.exe "dist/oxypixel-$version-windows-x86_64.exe"
          Copy-Item installer/oxypixel.ico dist/oxypixel.ico
          if (-not $env:MAKENSIS -or -not (Test-Path -LiteralPath $env:MAKENSIS)) {
            throw "MAKENSIS is not set to an existing makensis.exe"
          }
          $root = (Get-Location).Path
          $exe = Join-Path $root "dist\oxypixel.exe"
          $out = Join-Path $root "dist\OxyPixel-$version-Setup.exe"
          $script = Join-Path $root "installer\oxypixel.nsi"
          if (-not (Test-Path -LiteralPath $exe)) { throw "dist\oxypixel.exe was not staged" }
          # Pass absolute paths. File "../dist/oxypixel.exe" is missed when
          # makensis stays in the repository root.
          & $env:MAKENSIS "/DSOURCE_EXE=$exe" "/DOUTFILE=$out" $script
          if ($LASTEXITCODE -ne 0) { throw "makensis exited with $LASTEXITCODE" }
          $files = @(
            "dist/oxypixel-$version-windows-x86_64.exe",
            "dist/OxyPixel-$version-Setup.exe"
          )
          Get-FileHash $files -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content dist/SHA256SUMS-windows.txt
          Set-Content -Path dist/release-names.txt -Value @(
            "oxypixel-$version-windows-x86_64.exe",
            "OxyPixel-$version-Setup.exe",
            "SHA256SUMS-windows.txt"
          )
      - uses: actions/upload-artifact@v4
        with:
          name: oxypixel-windows-unsigned
          path: |
            dist/oxypixel-*-windows-x86_64.exe
            dist/OxyPixel-*-Setup.exe
            dist/SHA256SUMS-windows.txt

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Test and pack
        run: |
          cargo test --workspace
          chmod +x scripts/package-linux.sh scripts/package-deb.sh
          ./scripts/package-linux.sh
          ./scripts/package-deb.sh
          (cd dist && sha256sum oxypixel-*-linux-x86_64.tar.gz oxypixel-*-linux-x86_64.deb > SHA256SUMS-linux.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: oxypixel-linux-x86_64
          path: |
            dist/oxypixel-*-linux-x86_64.tar.gz
            dist/oxypixel-*-linux-x86_64.deb
            dist/SHA256SUMS-linux.txt

  publish:
    needs: [windows, linux]
    if: >-
      always() &&
      needs.windows.result == 'success' &&
      needs.linux.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: oxypixel-*
          path: artifacts
          merge-multiple: true
      - name: Collect release files
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp -t dist {} +
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          portable="oxypixel-${version}-windows-x86_64.exe"
          setup="OxyPixel-${version}-Setup.exe"
          linux="oxypixel-${version}-linux-x86_64.tar.gz"
          deb="oxypixel-${version}-linux-x86_64.deb"
          test -f "dist/${portable}"
          test -f "dist/${setup}"
          test -f "dist/${linux}"
          test -f "dist/${deb}"
          # The updater matches these basenames exactly. The first three stay
          # in the 0.3.0 order. The .deb is last. PackageKind looks up a full
          # name, so the extra line does not hide the tar.gz.
          (
            cd dist
            sha256sum "$portable" "$setup" "$linux" "$deb"
          ) > dist/SHA256SUMS.txt
          awk -v p="$portable" -v s="$setup" -v l="$linux" -v d="$deb" '
            NF != 2 || length($1) != 64 { exit 1 }
            { seen[$2] = 1 }
            END { if (!seen[p] || !seen[s] || !seen[l] || !seen[d]) exit 1 }
          ' dist/SHA256SUMS.txt
          # Accept "## 0.7.0" and Keep a Changelog "## [0.7.0] - 2026-10-26".
          awk -v ver="$version" '
            function section_version(line,    v) {
              if (match(line, /^## \[[0-9]+\.[0-9]+\.[0-9]+\]/)) {
                return substr(line, RSTART + 4, RLENGTH - 5)
              }
              if (match(line, /^## [0-9]+\.[0-9]+\.[0-9]+$/)) {
                return substr(line, 4)
              }
              if (match(line, /^## [0-9]+\.[0-9]+\.[0-9]+[^0-9.]/)) {
                v = substr(line, 4)
                sub(/[^0-9.].*$/, "", v)
                return v
              }
              return ""
            }
            section_version($0) == ver { show = 1; next }
            show && /^## / { exit }
            show { print }
          ' CHANGELOG.md > dist/release-notes.txt
          test -s dist/release-notes.txt
          echo "Release files:"
          ls -l dist
          echo "Checksums:"
          cat dist/SHA256SUMS.txt
      - name: Choose the release tag
        id: tag
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "name=v${version}" >> "$GITHUB_OUTPUT"
          fi
      - name: Attach Linux and Windows files to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: OxyPixel ${{ steps.tag.outputs.version }}
          body_path: dist/release-notes.txt
          files: |
            dist/oxypixel-*-windows-x86_64.exe
            dist/OxyPixel-*-Setup.exe
            dist/oxypixel-*-linux-x86_64.tar.gz
            dist/oxypixel-*-linux-x86_64.deb
            dist/SHA256SUMS-windows.txt
            dist/SHA256SUMS-linux.txt
            dist/SHA256SUMS.txt
