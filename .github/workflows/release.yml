name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Put rc.exe on PATH when the Windows SDK has it
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $rc = & $vswhere -latest -products * -find "**\rc.exe" | Select-Object -First 1
            if ($rc) { Add-Content $env:GITHUB_PATH (Split-Path $rc) }
          }
      - name: Test and build
        run: |
          cargo test --workspace
          cargo build --release -p oxypixel
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y
          # Chocolatey adds NSIS to the machine PATH in the registry. Actions
          # starts the next step from the original PATH plus GITHUB_PATH, so
          # `makensis` stays unresolved unless this directory is published.
          $candidates = @(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "$env:ProgramFiles\NSIS\makensis.exe"
          )
          $makensis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) {
            throw "makensis.exe was not found after 'choco install nsis'"
          }
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path -Parent $makensis)
          "MAKENSIS=$makensis" | Add-Content -Path $env:GITHUB_ENV
          Write-Host "Using $makensis"
      - name: Stage files
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/oxypixel.exe dist/oxypixel.exe
          Copy-Item target/release/oxypixel.exe "dist/oxypixel-$version-windows-x86_64.exe"
          Copy-Item installer/oxypixel.ico dist/oxypixel.ico
          if (-not $env:MAKENSIS -or -not (Test-Path -LiteralPath $env:MAKENSIS)) {
            throw "MAKENSIS is not set to an existing makensis.exe"
          }
          & $env:MAKENSIS installer/oxypixel.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis exited with $LASTEXITCODE" }
          $files = @(
            "dist/oxypixel-$version-windows-x86_64.exe",
            "dist/OxyPixel-$version-Setup.exe"
          )
          Get-FileHash $files -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content dist/SHA256SUMS-windows.txt
          Set-Content -Path dist/release-names.txt -Value @(
            "oxypixel-$version-windows-x86_64.exe",
            "OxyPixel-$version-Setup.exe",
            "SHA256SUMS-windows.txt"
          )
      - uses: actions/upload-artifact@v4
        with:
          name: oxypixel-windows-unsigned
          path: |
            dist/oxypixel-*-windows-x86_64.exe
            dist/OxyPixel-*-Setup.exe
            dist/SHA256SUMS-windows.txt
      - name: Attach Windows files to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/oxypixel-*-windows-x86_64.exe
            dist/OxyPixel-*-Setup.exe
            dist/SHA256SUMS-windows.txt

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Test and pack
        run: |
          cargo test --workspace
          chmod +x scripts/package-linux.sh
          ./scripts/package-linux.sh
          (cd dist && sha256sum oxypixel-*-linux-x86_64.tar.gz > SHA256SUMS-linux.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: oxypixel-linux-x86_64
          path: |
            dist/oxypixel-*-linux-x86_64.tar.gz
            dist/SHA256SUMS-linux.txt
      - name: Attach the Linux archive to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/oxypixel-*-linux-x86_64.tar.gz
            dist/SHA256SUMS-linux.txt
