name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Ubuntu finishes in about 5 minutes. Windows clippy was ~80s and the
    # release compile is a separate profile, so a healthy Windows run is
    # around 10 minutes. 15 leaves headroom without waiting out a hang.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Put rc.exe on PATH when the Windows SDK has it
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $rc = & $vswhere -latest -products * -find "**\rc.exe" | Select-Object -First 1
            if ($rc) { Add-Content $env:GITHUB_PATH (Split-Path $rc) }
          }
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Release build
        run: cargo build --workspace --release
