name: CI

# A pull-request branch used to start this workflow twice, once for `push`
# and once for `pull_request`. Windows minutes count double, so `push` is
# limited to `main`. Pull requests use `pull_request` only. Tag pushes are
# not listed here: `.github/workflows/release.yml` already tests and
# packages on `v*` tags and on workflow_dispatch.
#
# A newer push on the same ref cancels the run it replaces. Pull requests
# use the head branch name, so they do not cancel a `main` run.
#
# Docs-only changes (`*.md` and `docs/**`) skip the test matrix with a job
# `if`, not with `paths-ignore`. A workflow that path filters skip never
# reports its checks, and a required check then stays pending. A job skipped
# by `if` reports success, so the pull request is not blocked.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # Missing history, a new repository, or an empty diff still runs
          # the suite. Skipping those would hide a bad base.
          code=true
          if [ -n "${BASE_SHA}" ] && [ "${BASE_SHA}" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            code=false
            saw_file=false
            while IFS= read -r path; do
              [ -z "${path}" ] && continue
              saw_file=true
              case "${path}" in
                docs/*|*.md) ;;
                *) code=true ;;
              esac
            done < <(git diff --name-only "${BASE_SHA}" HEAD)
            if [ "${saw_file}" = false ]; then
              code=true
            fi
          fi
          echo "code=${code}" >> "${GITHUB_OUTPUT}"
          echo "Run the test matrix: ${code}"

  test:
    name: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    # Ubuntu finishes in about 5 minutes. Windows clippy was ~80s and the
    # release compile is a separate profile, so a healthy Windows run is
    # around 10 minutes. 15 leaves headroom without waiting out a hang.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Put rc.exe on PATH when the Windows SDK has it
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $rc = & $vswhere -latest -products * -find "**\rc.exe" | Select-Object -First 1
            if ($rc) { Add-Content $env:GITHUB_PATH (Split-Path $rc) }
          }
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Host clippy skips #[cfg(windows)]. make check-windows type-checks that
      # code with the MinGW target. A cold run is a second clippy, not a
      # Windows runner, so a Windows-only lint fails here instead of on the
      # minutes that count double. The windows-latest job still runs host clippy.
      #
      # The Ubuntu 24.04 image tries azure.archive.ubuntu.com first. When
      # that mirror stalls, apt-get update -qq prints nothing until the
      # job timeout. Drop Azure and install from the lists already on the
      # image. Refresh indexes only if the package is missing. timeout runs
      # as root so a stall dies with apt instead of leaving the lock held.
      - name: Windows-target clippy
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          fi
          apt_install() {
            sudo timeout -k 15s 90s apt-get install -y --no-install-recommends \
              -o Acquire::Retries=2 \
              -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15 \
              gcc-mingw-w64-x86-64
          }
          if ! apt_install; then
            echo "install from the image lists failed; refreshing from the Ubuntu archive"
            sudo timeout -k 15s 90s apt-get update \
              -o Acquire::Retries=2 \
              -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15
            apt_install
          fi
          rustup target add x86_64-pc-windows-gnu
          make check-windows
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Release build
        run: cargo build --workspace --release
      # Start the release exe, wait for its window, close it, and expect a
      # clean exit. Nothing here can click a message box, so
      # OXYPIXEL_NO_DIALOG keeps a startup failure on stderr instead of
      # waiting out the job. APPDATA points at a temp folder so recent files
      # and recovery copies stay off the runner profile.
      - name: Launch check
        if: matrix.os == 'windows-latest'
        shell: pwsh
        timeout-minutes: 2
        env:
          OXYPIXEL_NO_DIALOG: "1"
        run: |
          $data = Join-Path $env:RUNNER_TEMP "oxypixel-launch"
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          $env:APPDATA = $data
          $err = Join-Path $data "stderr.txt"
          $p = Start-Process -FilePath "target\release\oxypixel.exe" -PassThru -RedirectStandardError $err
          # Keep the handle so ExitCode is readable after the process ends.
          $null = $p.Handle
          $title = ""
          $deadline = (Get-Date).AddSeconds(45)
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 500
            $p.Refresh()
            if ($p.HasExited) { break }
            $title = $p.MainWindowTitle
            if ($title -like "OxyPixel - *") { break }
          }
          if ($p.HasExited) {
            Write-Host "OxyPixel exited during startup with code $($p.ExitCode)."
            Get-Content $err -ErrorAction SilentlyContinue
            exit 1
          }
          if ($title -notlike "OxyPixel - *") {
            Write-Host "No OxyPixel window after 45 seconds (title: '$title')."
            Stop-Process -Id $p.Id -Force
            Get-Content $err -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "Window up: $title"
          $null = $p.CloseMainWindow()
          if (-not $p.WaitForExit(15000)) {
            Write-Host "OxyPixel did not exit within 15 seconds of closing. A dialog may be open."
            Stop-Process -Id $p.Id -Force
            exit 1
          }
          Write-Host "Exited with code $($p.ExitCode)."
          Get-Content $err -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { exit 1 }
