[package]
name = "oxypixel"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Pixel-art editor for Windows and Linux"
publish = false
keywords = ["pixel-art", "editor", "sprites", "animation", "gui"]
categories = ["graphics", "gui"]
build = "build.rs"

[[bin]]
name = "oxypixel"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow"] }
flate2 = "1"
image = { workspace = true }
oxypixel-core = { path = "../oxypixel-core" }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false }

[dev-dependencies]
image = { workspace = true }
oxypixel-core = { path = "../oxypixel-core" }

[lints.rust]
unsafe_code = "forbid"
