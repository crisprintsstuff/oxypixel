[package]
name = "oxypixel"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Pixel-art editor for Windows and Linux"
publish = false
keywords = ["pixel-art", "editor", "sprites", "animation", "gui"]
categories = ["graphics", "gui"]
build = "build.rs"

[[bin]]
name = "oxypixel"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow"] }
image = { workspace = true }
oxypixel-core = { path = "../oxypixel-core" }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11"] }

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false }

[dev-dependencies]
image = { workspace = true }
oxypixel-core = { path = "../oxypixel-core" }

[lints.rust]
unsafe_code = "forbid"
