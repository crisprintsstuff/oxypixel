[package]
name = "oxypixel"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Pixel-art editor for Windows and Linux"
publish = false
keywords = ["pixel-art", "editor", "sprites", "animation", "gui"]
categories = ["graphics", "gui"]
build = "build.rs"

[[bin]]
name = "oxypixel"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "wgpu"] }
flate2 = "1"
image = { workspace = true }
oxypixel-core = { path = "../oxypixel-core" }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["image-data", "wayland-data-control"] }
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "wgpu", "x11"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }

[target.'cfg(windows)'.dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["image-data"] }
# eframe's wgpu leaves out Direct3D 12. It is the backend every Windows machine
# has, and its WARP adapter draws without a GPU, which is how CI starts the app.
wgpu = { version = "24.0.5", default-features = false, features = ["dx12"] }
rfd = { version = "0.15", default-features = false }

[dev-dependencies]
image = { workspace = true }
oxypixel-core = { path = "../oxypixel-core" }

[lints.rust]
unsafe_code = "forbid"

# cargo-deb packs the release binary. `$auto` records libraries the dynamic
# linker needs. libGL, libX11, libxkbcommon, libxkbcommon-x11, and libxcb are
# dlopened, so they are named beside `$auto`. Paths other than target/release
# are relative to this crate. See docs/LINUX-PACKAGING.md.
[package.metadata.deb]
maintainer = "OxyPixel contributors"
copyright = "2026 OxyPixel contributors"
section = "graphics"
priority = "optional"
depends = "$auto, libgl1, libx11-6, libxkbcommon0, libxcb1, libxkbcommon-x11-0"
# wgpu draws with Vulkan when these are present. Without them it falls back to libGL.
recommends = "libvulkan1, mesa-vulkan-drivers"
extended-description = "Draw on a pixel canvas, stack layers, animate frames, and import or export PNG, BMP, GIF, and palette files."
assets = [
    ["target/release/oxypixel", "usr/bin/", "755"],
    ["target/release/oxypack", "usr/bin/", "755"],
    ["../../docs/linux/oxypixel.desktop", "usr/share/applications/oxypixel.desktop", "644"],
    ["../../docs/linux/oxypixel.png", "usr/share/icons/hicolor/32x32/apps/oxypixel.png", "644"],
    ["../../docs/linux/oxypixel-mime.xml", "usr/share/mime/packages/oxypixel.xml", "644"],
    ["../../LICENSE", "usr/share/doc/oxypixel/copyright", "644"],
]
