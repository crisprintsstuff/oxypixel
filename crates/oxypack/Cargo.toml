[package]
name = "oxypack"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Pack sprites from PNG, GIF, BMP, and OxyPixel files into one atlas with a JSON description"
publish = false
keywords = ["pixel-art", "sprites", "atlas", "spritesheet"]
categories = ["graphics", "command-line-utilities"]

[lib]
name = "oxypack"
path = "src/lib.rs"

[[bin]]
name = "oxypack"
path = "src/main.rs"

[dependencies]
flate2 = "1"
image = { workspace = true }
oxypixel-core = { path = "../oxypixel-core" }
thiserror = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
