[workspace]
resolver = "2"
members = ["crates/oxypixel-core", "crates/oxypixel", "crates/oxypack"]

[workspace.package]
version = "0.8.5"
edition = "2021"
license = "MIT"
authors = ["OxyPixel contributors"]
repository = "https://github.com/crisprintsstuff/oxypixel"
rust-version = "1.85"
description = "Pixel-art editor for Windows and Linux"

[workspace.dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "gif"] }
thiserror = "2"

[profile.release]
strip = "symbols"
lto = false
codegen-units = 16
